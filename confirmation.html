<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Booking Confirmed — Darshan Setu</title>
<meta name="theme-color" content="#741d25">
<style>
body{margin:0;background:#fffdf9;color:#211b1b;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center}
.card{width:min(620px,calc(100% - 40px));background:white;border:1px solid #eadfd5;border-radius:28px;padding:42px;box-shadow:0 20px 60px #5b1c2414;text-align:center}
.mark{width:68px;height:68px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;background:#741d25;color:#e8c98c;font-size:30px}
h1{font:500 42px Georgia,serif;margin:0 0 14px;color:#3c1015}
p{color:#756d6a;line-height:1.7}
.summary{text-align:left;background:#fff7ec;border-radius:16px;padding:20px;margin:24px 0}
.row{display:flex;justify-content:space-between;gap:20px;padding:9px 0;border-bottom:1px solid #eadfd5}
.row:last-child{border-bottom:0}.label{color:#756d6a}.value{font-weight:700}
a{display:inline-block;background:#741d25;color:white;text-decoration:none;padding:14px 22px;border-radius:28px;font-weight:700}
</style>
</head>
<body>
<main class="card">
<div class="mark">ॐ</div>
<h1>Darshan Confirmed</h1>
<p>Your payment has been verified and your Darshan Setu booking is confirmed.</p>
<div class="summary" id="summary">Loading booking details…</div>
<p>Our team will contact you on WhatsApp with the next instructions.</p>
<a href="/">Back to Darshan Setu</a>
</main>
<script>
(async()=>{
 const id=new URLSearchParams(location.search).get("booking");
 const box=document.getElementById("summary");
 if(!id){box.textContent="Booking reference not found.";return}
 try{
  const r=await fetch("/api/booking/"+encodeURIComponent(id));
  const b=await r.json();
  if(!r.ok) throw new Error(b.error||"Unable to load booking");
  box.innerHTML=`
   <div class="row"><span class="label">Booking ID</span><span class="value">${b.id}</span></div>
   <div class="row"><span class="label">Name</span><span class="value">${b.name}</span></div>
   <div class="row"><span class="label">Date</span><span class="value">${b.date}</span></div>
   <div class="row"><span class="label">Time</span><span class="value">${b.time_slot}</span></div>
   <div class="row"><span class="label">People</span><span class="value">${b.people}</span></div>
   <div class="row"><span class="label">Amount paid</span><span class="value">₹${Number(b.amount/100).toLocaleString("en-IN")}</span></div>`;
 }catch(e){box.textContent=e.message}
})();
</script>
</body>
</html>
